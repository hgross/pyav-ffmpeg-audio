name: build
# Owner-triggered only. This fork deliberately has no push/pull_request
# triggers: workflow_dispatch requires write access to the repository, so
# nobody but the owner can start a run.
on:
  workflow_dispatch:
    inputs:
      local_version:
        description: "PEP 440 local version label appended to the av wheel version (av 16.1.0+<label>)"
        required: false
        default: "lgpl.audio.1"

jobs:
  build-ffmpeg:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Deliberately omitted upstream variant: musllinux (PySide6/Qt ship
        # no musl wheels, so ApexRelay Pilot cannot exist there).
        include:
          - os: macos-14
            shell: bash
            mac_arch: arm64
          - os: macos-15-intel
            shell: bash
            mac_arch: x86_64
          - os: windows-latest
            shell: 'msys2 {0}'
            msys_prefix: mingw-w64-x86_64
            msys_system: MINGW64
          - os: ubuntu-24.04
            shell: bash
            cibw_arch: x86_64
          - os: ubuntu-24.04-arm
            shell: bash
            cibw_arch: aarch64
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set deployment target
        if: runner.os == 'macOS'
        # Mirrors upstream: 11.0 for Intel, 14.0 for Apple Silicon.
        run: |
          if [ "${{ matrix.mac_arch }}" = "x86_64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          else
            echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          fi
      - name: Install packages for macOS
        if: runner.os == 'macOS'
        # Unlink Homebrew libraries so FFmpeg's configure cannot pick them up
        # (belt-and-braces next to --disable-autodetect). Tolerate formulae
        # missing from the runner image. Intel needs yasm for the x86 asm,
        # matching upstream.
        run: |
          brew update
          for formula in gettext libidn2 libpng libtiff libunistring libx11 libxau libxcb libxdmcp little-cms2 unbound; do
            brew unlink "$formula" 2>/dev/null || true
          done
          if [ "${{ matrix.mac_arch }}" = "x86_64" ]; then
            brew install yasm
          fi
      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows-latest'
        with:
          install: base-devel openssl-devel ${{ matrix.msys_prefix }}-gcc ${{ matrix.msys_prefix }}-nasm
          msystem: ${{ matrix.msys_system }}
          path-type: inherit
      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          # cibuildpkg expects cibuildwheel's arch selection; we build natively.
          ARCHFLAGS: -arch ${{ matrix.mac_arch }}
        run: python scripts/build-ffmpeg.py /tmp/vendor
      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: python scripts/build-ffmpeg.py C:/cibw/vendor
      - name: Build FFmpeg (Linux)
        if: runner.os == 'Linux'
        # Linux builds run INSIDE the manylinux container via cibuildwheel
        # (upstream's pattern): compiling on the runner's Ubuntu would link
        # against its new glibc and the wheels would not be portable. The
        # dummy package is just the vehicle; build-ffmpeg.py drops the
        # tarball into /output, which cibuildwheel copies to --output-dir.
        env:
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BEFORE_BUILD: python scripts/build-ffmpeg.py /tmp/vendor
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux*"
        run: |
          pip install cibuildwheel
          cibuildwheel --output-dir output
          rm -f output/*.whl
      - name: Upload FFmpeg
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-${{ matrix.os }}
          path: output/

  build-wheels:
    needs: build-ffmpeg
    # Run even if one build-ffmpeg matrix leg failed: each wheel leg only
    # needs its own platform's FFmpeg artifact (missing artifact -> that leg
    # fails on download, the other proceeds).
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            vendor_unix: /tmp/vendor
            tarball: ffmpeg-macos-arm64.tar.gz
          - os: macos-15-intel
            arch: x86_64
            vendor_unix: /tmp/vendor
            tarball: ffmpeg-macos-x86_64.tar.gz
          - os: windows-latest
            arch: AMD64
            vendor_unix: /c/cibw/vendor
            tarball: ffmpeg-windows-x86_64.tar.gz
          - os: ubuntu-24.04
            arch: x86_64
            tarball: ffmpeg-manylinux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            arch: aarch64
            tarball: ffmpeg-manylinux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v6
      - name: Check out PyAV v16.1.0
        uses: actions/checkout@v6
        with:
          repository: PyAV-Org/PyAV
          ref: v16.1.0
          path: pyav
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set deployment target
        if: runner.os == 'macOS'
        # Must match the FFmpeg build's target: 11.0 Intel, 14.0 Apple Silicon.
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          else
            echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          fi
      - name: Download FFmpeg
        uses: actions/download-artifact@v6
        with:
          name: ffmpeg-${{ matrix.os }}
          path: ffmpeg-dist
      - name: Unpack FFmpeg
        # On Linux the wheel build runs inside the manylinux container, so
        # the vendor tree is extracted there by CIBW_BEFORE_BUILD_LINUX
        # instead (the host filesystem is only mounted at /project).
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ matrix.vendor_unix }}"
          tar xzf "ffmpeg-dist/${{ matrix.tarball }}" -C "${{ matrix.vendor_unix }}"
          ls "${{ matrix.vendor_unix }}"/*
      - name: Stamp wheel local version
        shell: bash
        env:
          LOCAL_VERSION: ${{ inputs.local_version || 'lgpl.audio.1' }}
        run: |
          python - <<'EOF'
          import os
          import pathlib

          version = f"16.1.0+{os.environ['LOCAL_VERSION']}"
          path = pathlib.Path("pyav/av/about.py")
          path.write_text(f'__version__ = "{version}"\n')
          print("wheel version:", version)
          EOF
      - name: Build wheels
        shell: bash
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp312-* cp313-*"
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_BEFORE_BUILD_LINUX: mkdir -p /tmp/vendor && tar xzf /project/ffmpeg-dist/${{ matrix.tarball }} -C /tmp/vendor
          CIBW_ENVIRONMENT_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
          CIBW_ENVIRONMENT_MACOS: PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig LDFLAGS=-headerpad_max_install_names
          CIBW_ENVIRONMENT_WINDOWS: INCLUDE=C:\\cibw\\vendor\\include LIB=C:\\cibw\\vendor\\lib
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path C:\cibw\vendor\bin -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: numpy
          # The test script must live OUTSIDE the PyAV checkout: the script's
          # directory lands on sys.path, and the source tree's av/ package
          # would shadow the installed wheel.
          CIBW_TEST_COMMAND: python {project}/scripts/wheel_smoke_test.py
        run: |
          pip install cibuildwheel delvewheel
          cibuildwheel pyav --output-dir dist
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist/
